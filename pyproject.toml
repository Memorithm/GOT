[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memorithm-got"
version = "1.1.0"
description = "Agent adversity bench for Memorithm"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.3.5",
  "pandas==2.2.3",
  "scipy==1.17.0",
]

[tool.setuptools.packages.find]
include = ["got*"]
