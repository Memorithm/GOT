name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked runtime
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Compile Python package
        run: python -m compileall -q got
      - name: Import and CLI smoke tests
        run: |
          python -c "import got; from got import StatisticalAnalyzer, TaguchiHarness"
          python -m got --help
      - name: Functional tests
        run: python -m unittest discover -s tests -v
