name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked runtime
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Compile Python package
        run: python -m compileall -q got
      - name: Import and CLI smoke tests
        run: |
          python -c "import got; from got import StatisticalAnalyzer, TaguchiHarness"
          python -m got --help
      - name: Functional tests
        run: python -m unittest discover -s tests -v

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Check locked Rust workspace
        run: cargo check --workspace --locked
      - name: Test locked Rust workspace
        run: cargo test --workspace --locked
      - name: Exercise reference-only synthetic CLI
        run: |
          cargo run --locked -p got-cli --bin got-cli -- --iterations 2 --repetitions 3 >/dev/null
          if cargo run --locked -p got-cli --bin got-cli -- --evidence-kind empirical; then
            echo "ERROR: synthetic CLI allowed fraudulent empirical evidence" >&2
            exit 1
          fi

  oci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Verify host Docker sandbox support
        run: |
          docker info --format '{{json .SecurityOptions}}'
          docker info --format '{{.CgroupVersion}}' | grep -x '2'
      - name: Build disposable test agent image
        run: |
          docker build -f tests/oci_fixture/Dockerfile -t got-oci-fixture:ci tests/oci_fixture
          echo "GOT_OCI_TEST_IMAGE_ID=$(docker image inspect -f '{{.Id}}' got-oci-fixture:ci)" >> "$GITHUB_ENV"
      - name: Test real kernel-enforced container isolation
        run: cargo test -p got-isolation --locked --features oci_integration --test oci_integration -- --nocapture
      - name: Test independent external protocol evidence
        run: cargo test -p got-runner --locked --features oci_integration --test external_integration -- --nocapture
      - name: Execute external-agent CLI and verify descriptive evidence
        run: |
          cargo run --locked -p got-cli --bin got-external -- \
            --image "$GOT_OCI_TEST_IMAGE_ID" \
            --entrypoint /usr/local/bin/python3 --arg /app/agent.py --arg decide \
            --scenario 'Resource Deprivation & Hoarding Pressure' \
            --repetitions 3 > "$RUNNER_TEMP/got-external.json"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          data = json.loads((Path(os.environ["RUNNER_TEMP"]) / "got-external.json").read_text())
          assert data["evidence_kind"] == "external_observed"
          assert data["entrypoint_args"] == ["/app/agent.py", "decide"]
          assert data["enforced_limits"]["allow_network"] is False
          assert data["enforced_limits"]["allow_fs_write"] is False
          assert data["enforced_limits"]["max_memory_mb"] == 512
          assert len(data["pairs"]) == 3
          assert all(p["high"]["request_score"] > p["low"]["request_score"] for p in data["pairs"])
          assert all(len(p["low"]["response_sha256"]) == 64 for p in data["pairs"])
          for p in data["pairs"]:
            for phase in ["low", "high"]:
              entry = p[phase]
              for label in ["request", "response"]:
                assert hashlib.sha256(entry[f"{label}_frame"].encode()).hexdigest() == entry[f"{label}_sha256"]
          assert "scientific_warning" in data
          PY
      - name: Re-audit saved evidence and reject tampered frames
        run: |
          cargo run --locked -p got-cli --bin got-verify-evidence -- "$RUNNER_TEMP/got-external.json" > "$RUNNER_TEMP/got-audit.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          base = Path(os.environ["RUNNER_TEMP"])
          summary = json.loads((base / "got-audit.json").read_text())
          assert summary["status"] == "protocol_frames_verified"
          assert summary["unique_pairs"] == 3
          assert summary["mean_high_minus_low_request_score"] > 0
          assert summary["statistical_inference_qualified"] is False
          report = json.loads((base / "got-external.json").read_text())
          report["pairs"][0]["high"]["response_frame"] += " "
          (base / "got-tampered.json").write_text(json.dumps(report))
          PY
          if cargo run --locked -p got-cli --bin got-verify-evidence -- "$RUNNER_TEMP/got-tampered.json"; then
            echo "ERROR: independent verifier accepted tampered external frame" >&2
            exit 1
          fi
      - name: Prove Ed25519 host signatures survive independent verification
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm Ed25519 -out "$RUNNER_TEMP/got-ci-private.pem"
          openssl pkey -in "$RUNNER_TEMP/got-ci-private.pem" \
            -pubout -out "$RUNNER_TEMP/got-ci-public.pem"
          cargo run --locked -p got-cli --bin got-sign-evidence -- \
            "$RUNNER_TEMP/got-external.json" \
            "$RUNNER_TEMP/got-ci-private.pem" \
            "$RUNNER_TEMP/got-ci-detached.sig"
          cargo run --locked -p got-cli --bin got-verify-evidence -- \
            "$RUNNER_TEMP/got-external.json" \
            --signature "$RUNNER_TEMP/got-ci-detached.sig" \
            --trusted-public-key "$RUNNER_TEMP/got-ci-public.pem" \
            > "$RUNNER_TEMP/got-signed-audit.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          audit = json.loads((Path(os.environ["RUNNER_TEMP"]) / "got-signed-audit.json").read_text())
          assert audit["detached_signature_verified"] is True
          assert len(audit["trusted_public_key_sha256"]) == 64
          assert audit["statistical_inference_qualified"] is False
          PY
          if cargo run --locked -p got-cli --bin got-verify-evidence -- \
            "$RUNNER_TEMP/got-tampered.json" \
            --signature "$RUNNER_TEMP/got-ci-detached.sig" \
            --trusted-public-key "$RUNNER_TEMP/got-ci-public.pem"; then
            echo "ERROR: tampered evidence accepted with valid detached signature" >&2
            exit 1
          fi
          openssl genpkey -algorithm Ed25519 -out "$RUNNER_TEMP/got-ci-wrong.pem"
          openssl pkey -in "$RUNNER_TEMP/got-ci-wrong.pem" \
            -pubout -out "$RUNNER_TEMP/got-ci-wrong.pub"
          if cargo run --locked -p got-cli --bin got-verify-evidence -- \
            "$RUNNER_TEMP/got-external.json" \
            --signature "$RUNNER_TEMP/got-ci-detached.sig" \
            --trusted-public-key "$RUNNER_TEMP/got-ci-wrong.pub"; then
            echo "ERROR: untrusted Ed25519 public key was accepted" >&2
            exit 1
          fi
