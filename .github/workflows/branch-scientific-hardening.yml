name: Branch scientific hardening

on:
  push:
    branches:
      - feature/scirust-integration

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/scirust-integration
      - name: Remove invalid ordered and association analyses
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('got/scirust_bridge.py')
          s = p.read_text()
          s = s.replace('    # Undirected association summary (using scirust-causal capabilities)\n', '    # Undirected descriptive association summary\n')
          old = '''        # Prepare regression data: use experiment index as x, effect size as y\n        xs = list(range(len(experiments)))\n        ys = [e.effect_size for e in experiments]\n\n        # Fit linear regression\n        reg_result = self.regress(xs, ys, degree=1)\n\n        # Compute confidence intervals (95%)\n        n = len(experiments)\n        mean_effect = np.mean(ys)\n        std_effect = np.std(ys, ddof=1) if n > 1 else 0.0\n        se = std_effect / np.sqrt(n) if n > 0 else 0.0\n\n        # Also fit quadratic to detect non-linear effects\n        quad_result = None\n        if n >= 3:\n            try:\n                quad_result = self.regress(xs, ys, degree=2)\n            except RuntimeError:\n                pass\n\n        return {\n            \"linear_regression\": reg_result,\n            \"quadratic_regression\": quad_result,\n            \"mean_effect\": float(mean_effect),\n'''
          new = '''        ys = [e.effect_size for e in experiments]\n        n = len(experiments)\n        if n == 0:\n            return {\n                \"mean_effect\": 0.0,\n                \"std_effect\": 0.0,\n                \"ci_95\": [0.0, 0.0],\n                \"n_experiments\": 0,\n                \"effect_range\": [0.0, 0.0],\n            }\n\n        mean_effect = np.mean(ys)\n        std_effect = np.std(ys, ddof=1) if n > 1 else 0.0\n        se = std_effect / np.sqrt(n)\n\n        return {\n            \"mean_effect\": float(mean_effect),\n'''
          if old not in s:
              raise SystemExit('effect-summary block not found')
          s = s.replace(old, new)
          p.write_text(s)

          p = Path('got/__main__.py')
          s = p.read_text()
          old = '''    # Also use scirust patterns for top cause trend analysis\n    if scirust:\n        top5_names = [name for name, _ in rankings[:5]]\n        top5_effects = [abs(models[name][\"effect_size\"]) for name in top5_names]\n        patterns = scirust.detect_patterns(top5_effects)\n        print(f\"    Scirust trend analysis: {patterns['trend']} pattern detected\")\n\n'''
          if old not in s:
              raise SystemExit('ranked-cause trend block not found')
          s = s.replace(old, '')
          start = s.index('    # ── Phase 6 : analyse associative avec scirust ──\n')
          end = s.index('    print(\"  \" + \"=\" * 72)\n', start)
          replacement = '''    # Pairwise association analysis is intentionally not run here: the\n    # benchmark result records do not provide a rectangular observation matrix\n    # over multiple measured variables. Supplying cause names with missing\n    # columns would manufacture NaN correlations and misleading edges.\n\n'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY
      - name: Compile package
        run: python -m compileall -q got
      - name: Commit hardening
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add got/scirust_bridge.py got/__main__.py
          git commit -m "fix: remove unsupported association and ordering claims"
          git push origin HEAD:feature/scirust-integration
